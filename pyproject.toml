[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobalerts"
version = "0.1.0"
description = "Watches employer job boards, scores new postings against your work stories with AI, and alerts you; web UI and Home Assistant."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "pypdf>=4.0",       # text from PDF resumes
    "paho-mqtt>=2.0",   # Home Assistant dashboard sensor
    "tzdata",  # zoneinfo database (Windows and slim Docker images ship without one)
    "fastapi>=0.115",          # web UI
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9", # form posts
    "cryptography>=42",        # secret vault (Fernet)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]
taxes = ["policyengine-us==2.88.9"]   # only to rebuild config/tax_data/ (tools/build_tax_data.py; Python <= 3.14)

[project.scripts]
jobalerts = "jobalerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobalerts = ["map_template.html", "examples/*", "examples/stories/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60          # a test that hangs (a service loop left running) fails instead of stalling the run
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "B"]          # pyflakes (undefined names, unused imports) and likely bugs
ignore = ["B905", "B008"]    # zip(strict=) and FastAPI's Form()/Depends() defaults are intended

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # tests reuse test_pipeline's `env` fixture by importing it
