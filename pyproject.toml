[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobalerts"
version = "0.1.0"
description = "Polls employer ATS job boards directly and pushes matching new postings to your phone via ntfy."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "pypdf>=4.0",       # text from PDF resumes
    "paho-mqtt>=2.0",   # Home Assistant dashboard sensor
    "tzdata",  # zoneinfo database (Windows and slim Docker images ship without one)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobalerts = "jobalerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
