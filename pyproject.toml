[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobalerts"
version = "0.1.0"
description = "Watches employer job boards, scores new postings against your work stories with AI, and alerts you; web UI and Home Assistant."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "pypdf>=4.0",       # text from PDF resumes
    "paho-mqtt>=2.0",   # Home Assistant dashboard sensor
    "tzdata",  # zoneinfo database (Windows and slim Docker images ship without one)
    "fastapi>=0.115",          # web UI
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9", # form posts
    "cryptography>=42",        # secret vault (Fernet)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
taxes = ["policyengine-us"]   # only to rebuild config/tax_data.json (tools/build_tax_data.py)

[project.scripts]
jobalerts = "jobalerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobalerts = ["map_template.html", "examples/*", "examples/stories/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
