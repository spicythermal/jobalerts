{% extends "base.html" %}
{% block title %}Log in · Job alerts{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Job alerts</h1>
<form method="post" action="/login" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <button type="submit">Log in</button>
</form>
<p class="muted">Forgot it? Run <code>jobalerts set-password</code> on the machine running jobalerts.</p>
{% endblock %}
