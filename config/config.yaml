# jobalerts configuration. Secrets live in .env and are referenced as ${VAR}.
# Restart the service after editing (docker compose restart jobalerts).

contact_email: "${CONTACT_EMAIL}"   # goes in the User-Agent so site operators can reach you
database: data/jobalerts.db         # relative to the working directory (/app in Docker)
companies_file: companies.yaml      # relative to this file

# ---------------------------------------------------------------- what to match
# An example for R&D leadership roles (ion/electron/plasma physics,
# systems engineering, simulation/HPC). A wide net on purpose: AI scoring ranks what gets through.
# Phrases are case-insensitive whole words.
criteria:
  title_include:            # a job must match at least one (empty = every title)
    # physics and beam/plasma domain
    - physicist
    - physics
    - plasma
    - ion beam
    - ion optics
    - ion source
    - electron beam
    - e-beam
    - electron optics
    - charged particle
    - focused ion beam
    - fib
    - accelerator
    - beam
    - fusion
    - pulsed power
    - high voltage
    - vacuum
    - rf
    - microwave
    - microscopy
    - lithography
    - metrology
    - optics
    - diagnostics
    # science and R&D roles
    - scientist
    - research
    - r&d
    - rd&e
    - technology development
    - advanced development
    - new product introduction
    - npi
    - productization
    # systems engineering
    - systems engineer
    - systems engineering
    - system engineer
    - systems architect
    - system architect
    - chief engineer
    - technical lead
    - technologist
    # leadership
    - group leader
    - group lead
    - team lead
    - engineering manager
    - manager, engineering
    - r&d manager
    - research manager
    - director of engineering
    - director, engineering
    - director of research
    - director, r&d
    - head of engineering
    - head of research
    - head of hardware
    - head of physics
    # simulation and scientific computing
    - simulation
    - modeling
    - modelling
    - computational
    - multiphysics
    - hpc
    - high performance computing
    - scientific computing
    - research software
  title_exclude:
    - sales
    - account executive
    - account manager
    - business development
    - marketing
    - recruiter
    - talent
    - customer success
    - field service
    - service engineer
    - technician
    - postdoc
    - postdoctoral
    - clinical
    - data scientist
    - market research
    - user research
    - ux research
    - legal
    - counsel
    - finance
    - accounting
  seniority_exclude:        # checked against the title, like title_exclude
    - intern
    - internship
    - co-op
    - junior
    - entry level
    - new grad
    - graduate program
  description_exclude: []   # e.g. "active secret clearance"; only checked for keyword matches
  # Assumed: Portland/Hillsboro area or remote. Add cities or states here (or empty the list
  # for anywhere) if you'd relocate, e.g. new mexico, california, massachusetts.
  locations:                # a job must match one (empty = anywhere)
    - remote
    - oregon
    - us-or
    - ", or"
    - portland
    - hillsboro
    - beaverton
    - tigard
    - tualatin
    - wilsonville
    - vancouver, wa
  allow_remote: true        # remote jobs pass the location check
  max_age_days: 7           # a "new" job published longer ago than this is ignored

# ---------------------------------------------------------------- how often to poll
polling:
  tiers:                    # seconds between polls; each company picks a tier
    priority: 180
    normal: 600
    slow: 1800
  jitter: 0.2               # +/-20% randomness so polls don't line up
  host_min_interval:        # minimum seconds between requests to the same host
    default: 1.0
    boards-api.greenhouse.io: 1.0
    myworkdayjobs.com: 5.0
  failure_alert_threshold: 5   # push a health alert after this many failures in a row
  max_backoff: 3600            # failing boards back off up to this many seconds
  max_alerts_per_poll: 5       # more matches than this from one board -> digest instead

# ---------------------------------------------------------------- AI fit scoring
scoring:
  enabled: false            # turn on after setting ANTHROPIC_API_KEY (and filling in profile.md)
  model: claude-haiku-5-5   # ~$0.001 per scored posting with two resumes in the (cached) prompt
  effort: low
  profile_path: profile.md  # preferences and deal-breakers the resumes don't say
  resume_dir: ../resume_reference   # every PDF/.md/.txt resume here is compared against each posting
  push_threshold: 75        # >= this: phone alert now
  digest_threshold: 50      # >= this: evening digest; below: stored only
  daily_max_calls: 300

# ---------------------------------------------------------------- phone notifications (ntfy)
notify:
  server: https://ntfy.sh
  topic: "${NTFY_TOPIC}"    # use a long random topic name; anyone who knows it can read it
  token: "${NTFY_TOKEN}"    # optional access token (self-hosted ntfy or ntfy.sh account)
  timezone: America/Los_Angeles
  digest_time: "18:00"
  digest_max_items: 20

# ---------------------------------------------------------------- Home Assistant dashboard
# Publishes sensor.job_alerts: state = matches posted in the last `days`, attribute `jobs` =
# the best `top_n` (AI score, then newest). See the README for a dashboard card.
homeassistant:
  enabled: false
  url: "${HA_URL}"          # e.g. http://192.168.1.10:8123
  token: "${HA_TOKEN}"      # long-lived access token: HA profile -> Security
  entity_id: sensor.job_alerts
  top_n: 3
  days: 7
  interval: 300             # refresh every 5 min, and right after new matches

# ---------------------------------------------------------------- broad-net aggregators
# Slower, catch-all searches for companies not on the watch list. Their matches also
# feed "hiring for your search, not on your watch list" suggestions in the digest.
aggregators:
  usajobs:                  # free key: https://developer.usajobs.gov/apirequest/
    enabled: false
    interval: 1800
    searches:
      - {keyword: "physicist"}
      - {keyword: "plasma"}
      - {keyword: "accelerator"}
      - {keyword: "systems engineer", location: "Oregon"}
  adzuna:                   # free key: https://developer.adzuna.com/signup
    enabled: false
    interval: 3600
    country: us
    searches:
      - {what: "physicist", where: "Oregon"}
      - {what: "plasma", where: "Oregon"}
      - {what: "ion beam"}
      - {what: "R&D manager physics", where: "Oregon"}
  jsearch:                  # paid slot (RapidAPI). Free plan ~200 calls/month: keep interval >= 14400
    enabled: false
    interval: 14400
    searches:
      - {query: "physicist R&D manager"}
