# jobalerts defaults. Don't put your own values here: change them on the web UI's Settings page,
# or in data/config.local.yaml (only the settings you change, merged on top of this file; not
# tracked by git). Secrets live in .env or on the Settings page, referenced here as ${VAR}.
# Restart the service after editing either file (docker compose restart jobalerts).

contact_email: "${CONTACT_EMAIL}"   # goes in the User-Agent so site operators can reach you
database: data/jobalerts.db         # relative to the working directory (/app in Docker)
companies_file: ../data/companies.yaml   # your watch list, relative to this file (created from an example)

# ---------------------------------------------------------------- what to match
# An example for physics, beams, plasma, optics and R&D leadership roles: replace the word lists
# with your own field. A wide net on purpose: AI scoring ranks what gets through.
criteria:
  # Phrases are case-insensitive whole words, plurals included ("beam" matches "Beams").
  # A * at either end lets the phrase run into a longer word: "*physicist" matches
  # "Cryophysicist", "diagnostic*" matches "Diagnostician", "research*" matches "Researcher".
  #
  # A title passes when it has a field word or a role word, and no exclude word.
  title_field:              # the work itself; also overrides title_exclude_soft
    # physics and beam/plasma domain
    - "*physicist"
    - physics
    - plasma
    - ion beam
    - ion optics
    - ion source
    - ion implant
    - electron beam
    - e-beam
    - electron optics
    - charged particle
    - focused ion beam
    - fib
    - accelerator
    - beam
    - beamline
    - fusion
    - implosion
    - neutronics
    - pulsed power
    - high voltage
    - vacuum
    - rf
    - microwave
    - "diagnostic*"         # diagnostics, diagnostician
    - "spectroscop*"
    - "spectromet*"
    - detector
    - x-ray
    - radiation
    - nuclear
    - reactor
    - magnet
    - "superconduct*"
    - "cryogenic*"
    # optics, photonics and semiconductor process
    - laser
    - photonics
    - optics
    - optical
    - "electro-optic*"
    - light source
    - euv
    - lithography
    - metrology
    - etch
    - deposition
    - thin film
    # common non-English titles (DE, FR, ES/PT, NL)
    - "physiker*"
    - "physicien*"
    - físico
    - física
    - fysicus
    - "beschleuniger*"
    - physique
    - "accélérateur*"
    - source d'ion
    - sources d'ion
    - faisceau d'ion
    - faisceaux d'ion
    - faisceau d'électron
    - faisceaux d'électron
    - optique électronique
    - optique ionique
    - ultravide
    - "*microscop*"         # microscopie, elektronenmicroscoop
    - "elektronen*"         # elektronenoptica, Elektronenstrahl
  title_include:            # the kind of role
    # science and R&D roles
    - scientist
    - "research*"           # research, researcher
    - scientific
    - r&d
    - rd&e
    - technology development
    - advanced development
    - new product introduction
    - npi
    - productization
    # systems engineering
    - systems engineer
    - systems engineering
    - system engineer
    - systems architect
    - system architect
    - chief engineer
    - technical lead
    - technologist
    - member of technical staff
    - distinguished engineer
    # leadership
    - "group lead*"         # group lead, group leader
    - "team lead*"
    - engineering manager
    - manager, engineering
    - research manager
    - director of engineering
    - director, engineering
    - director of research
    - director, r&d
    - head of engineering
    - head of research
    - head of hardware
    - head of physics
    # simulation and scientific computing
    - simulation
    - modeling
    - modelling
    - computational
    - multiphysics
    - hpc
    - high performance computing
    - scientific computing
    - research software
    # common non-English titles (DE, FR, ES/PT, NL)
    - "wissenschaftler*"
    - "entwicklungsingenieur*"
    - ingénieur de recherche
    - "chercheur*"
    - directeur technique
    - chef de groupe
    - "onderzoeker*"
    - wetenschapper
    - teamleider
    - "pesquisador*"
    - "investigador*"
  title_exclude:            # always drops the job, whatever else the title says
    - sales
    - account executive
    - account manager
    - business development
    - marketing
    - recruiter
    - talent
    - customer success
    - field service
    - service engineer
    - technician
    - welder               # trades: "Nuclear Welder" is not a physics job
    - machinist
    - assembler
    - inspector
    - toolmaker
    - postdoc
    - postdoctoral
    - legal
    - counsel
    - finance
    - accounting
    - sourcing
    - procurement
    - buyer
    # the same in French
    - "technicien*"
    - assembleur
    - monteur
    - câbleur
    - acheteur
    - approvisionneur
    - ingénieur commercial
    - technico-commercial
  title_exclude_soft:       # drops the job unless the title also has a title_field word
    - clinical              # "Clinical Specialist" goes, "Clinical Physicist" stays
    - data scientist        # "Applied Plasma Data Scientist" stays
    - market research
    - user research
    - ux research
  seniority_exclude:        # checked against the title, like title_exclude
    - intern
    - internship
    - co-op
    - junior
    - entry level
    - new grad
    - recent graduate
    - graduate program
    - early career
    - trainee
    - apprentice
    - student               # working student, summer student
    - thesis
    # internships and student jobs in DE, FR, ES/PT. French internships start with
    # "Stage -", "Stage 2027", "Stage Ingénieur"...; a rocket "Stage Test Engineer" is not one.
    - praktikum
    - "praktikant*"
    - "werkstudent*"
    - abschlussarbeit
    - masterarbeit
    - bachelorarbeit
    - stage -
    - stage-
    - stage –
    - "stage 20*"
    - stage de
    - stage en
    - "stage ingénieur*"
    - "stage bac*"
    - stagiaire
    - alternance
    - apprenti
    - estágio
    - pasantía
    - becario
  description_exclude: []   # e.g. "active secret clearance"; only checked for keyword matches
  # Worldwide: the AI score and the pay index rank by your profile and stay-or-move preference.
  # To keep only nearby jobs, list places, e.g. [remote, colorado, ", co", denver, boulder].
  locations: []             # a job must match one (empty = anywhere)
  allow_remote: true        # remote jobs pass the location check
  max_age_days: 7           # a "new" job published longer ago than this is ignored

# ---------------------------------------------------------------- how often to poll
polling:
  tiers:                    # seconds between polls; each company picks a tier
    priority: 180
    normal: 600
    slow: 1800
  jitter: 0.2               # +/-20% randomness so polls don't line up
  host_min_interval:        # minimum seconds between requests to the same host
    default: 1.0
    boards-api.greenhouse.io: 1.0
    myworkdayjobs.com: 5.0
    api.theirstack.com: 6.0  # free plan: 10 calls a minute
  failure_alert_threshold: 5   # push a health alert after this many failures in a row
  max_backoff: 3600            # failing boards back off up to this many seconds
  max_alerts_per_poll: 5       # more matches than this from one board -> digest instead

# ---------------------------------------------------------------- AI fit scoring
scoring:
  enabled: true             # stays off (keywords only) until ANTHROPIC_API_KEY is set in .env
  model: claude-haiku-5-5   # ~$0.001 per scored posting with two resumes in the (cached) prompt
  effort: low
  profile_path: ../data/profile.md  # preferences and deal-breakers the resumes don't say
  resume_dir: ../data/resumes       # every PDF/.md/.txt resume here is compared against each posting
  stories_dir: ../data/stories      # work stories (*.md); when there are any, fit is judged from them
  push_threshold: 75        # >= this: phone alert now
  digest_threshold: 50      # >= this: evening digest; below: stored only
  step_up_threshold: 75     # AI "step up" score >= this (a clear, credible promotion): phone alert too, even
                            # when the fit score is lower. Its own ranking is in `jobalerts top`; 0 = off
  daily_max_calls: 500      # all Claude calls a day: scoring + pre-screen (~75 scored + ~50 pre-screen calls typical)
                            # The day is UTC (resets 4-5 PM Pacific). When it's spent, new matches go to the digest.
  backfill_reserve: 150     # `backfill` and `--rescore` stop with this many calls left for new jobs; run again to continue

# ---------------------------------------------------------------- AI second look at rejected titles
# Jobs the keywords turn down (but no title_exclude / seniority_exclude did) wait here and get a cheap
# Claude look every `interval`: clear misfits by title go, then clear misfits by description excerpt;
# the rest get the full score above. Tested 2026-11-06 on a week of real postings: kept both rejected
# postings the full score rated 75+ and two thirds of those rated 50+, ~17% passed on; ~$1/month.
prescreen:
  enabled: true             # needs scoring (above); off without ANTHROPIC_API_KEY
  interval: 3600            # seconds between runs
  title_batch: 50           # titles per pass-1 call
  posting_batch: 8          # postings per pass-2 call
  excerpt_chars: 3000       # description characters per posting in pass 2

# ---------------------------------------------------------------- cost-of-living pay index
# Take-home pay against local prices, relative to the reference: your current salary where you
# live = 1.0. Set both on the Settings page. US prices: BEA Regional Price Parities, HUD rents and
# Zillow home values by metro; abroad: World Bank purchasing-power parity. See src/jobalerts/col.py.
# Explain one case: jobalerts pay "$150K-180K" "Austin, TX"
pay:
  enabled: true
  reference_salary: 100000  # your current base salary
  reference_location: "United States"   # where you live now, e.g. "Denver, CO" (US average until set)
  min_index: 1.05           # skip AI scoring and alerts when even the top of the stated range is under this,
                            # renting AND buying (a job passes if either index clears it); 0 = off.
                            # (no stated pay: scored anyway). Skipped jobs are listed in the digest.
  col_data: col_data.json   # committed seed; refreshed copies go to data/col_data.json
  refresh_days: 30          # re-download BEA + World Bank data when older than this (checked daily); 0 = never
  taxes: true               # index on take-home pay: after federal, state, local and payroll taxes where the job is
  tax_rules: taxes.yaml     # household (married filing jointly, 6% pre-tax 401k), local taxes, rates abroad
  tax_data: tax_data.json   # US taxes by salary and place; rebuild each January with tools/build_tax_data.py
  housing_share: 0.40       # family housing: rent + utilities as a share of spending, priced at HUD's 4-bedroom
                            # Fair Market Rent for the metro (see col.py). 0.40 fits a family renting a
                            # 3-4 bedroom home; 0 = plain BEA RPP.
  buy:                      # second index: the family buys a typical 4-bedroom home instead of renting one.
    enabled: true           # Price: Zillow 4-bedroom home value (metro, else state); rate: Freddie Mac 30-year.
    down_payment: 0.20      # Own cost/month = (loan x rate + price x (property tax + upkeep)) / 12 + utilities.
    upkeep: 0.0075          # insurance + maintenance a year, share of the price
    utilities: 350          # $/month at US-average utility prices (scaled by the metro's utility prices)
    property_tax: 0.010     # a year, share of the purchase price, for states not listed below
    property_tax_by_state:  # approximate statewide effective rates; counties vary a lot. CA = a new purchase
      CA: 0.0115            # (Prop 13 resets the assessment to the price, plus local bonds)
      TX: 0.018
      NJ: 0.022
      IL: 0.021
      CT: 0.018
      NH: 0.018
      NY: 0.014
      PA: 0.014
      OH: 0.015
      MI: 0.015
      WI: 0.016
      MA: 0.011
      WA: 0.009
      CO: 0.0055
      UT: 0.0055
      AZ: 0.006
      NV: 0.006
      HI: 0.003
  current_home:             # staying put is what you compare a move with: both indexes use what your own home costs
    payment: 0              # now instead of market rent or price at the reference location (payment 0 = off).
    principal: 0            # Mortgage payment incl. escrowed tax + insurance; the principal part is saving, not
    upkeep: 0               # cost; upkeep = repairs (~1% of value a year). Utilities are added at local prices.
    rate: 0                 # locked-in rate (for the explanation): buying elsewhere means today's rate instead
  city_weight: 0.5          # move the metro's home prices and rents this far toward the job's city's (Zillow city
                            # data): 0 = anywhere in the metro, 1 = in the job's city, 0.5 = living near the job
  locations:                # whole words of a location -> a place ("Palo Alto, CA"), state code, ISO3 country or "home"
    # Siemens Healthineers (Varian) posts site codes instead of cities
    "PAO H": "Palo Alto, CA"
    "MLV": "Philadelphia, PA"       # Malvern, PA
    "CHI WM": "Chicago, IL"
    "ATL G": "Atlanta, GA"
    "AUS S": "Austin, TX"
    "BOS FE": "Boston, MA"
    "CLT BA": "Charlotte, NC"
    "YOW B": "Ottawa, Canada"
    "SEL SD": "Seoul, South Korea"
    "SHA WH": "Shanghai, China"
    "PUN MIC": "Pune, India"
    "HEL AA": "Helsinki, Finland"
    "Los Alamos": NM

# ---------------------------------------------------------------- phone notifications (ntfy)
notify:
  server: https://ntfy.sh
  topic: "${NTFY_TOPIC}"    # use a long random topic name; anyone who knows it can read it
  token: "${NTFY_TOKEN}"    # optional access token (self-hosted ntfy or ntfy.sh account)
  timezone: America/New_York
  digest_time: "18:00"
  digest_max_items: 20

# ---------------------------------------------------------------- Home Assistant dashboard
# Publishes sensor.job_alerts through Home Assistant's MQTT broker (MQTT discovery; no HA
# token needed). State = matches posted in the last `days`, attribute `jobs` = the best
# `top_n` (AI score, then newest). See the README for the broker login and a dashboard card.
homeassistant:
  enabled: true             # idle until MQTT_HOST is set in .env
  mqtt_host: "${MQTT_HOST}"         # e.g. the Home Assistant box's IP (Mosquitto add-on)
  mqtt_port: 1883
  mqtt_username: "${MQTT_USERNAME}"
  mqtt_password: "${MQTT_PASSWORD}"
  mqtt_tls: false
  discovery_prefix: homeassistant
  base_topic: jobalerts     # writes jobalerts/top/state and jobalerts/top/attributes
  top_n: 10                 # best fits, and separately the biggest step ups (attribute `step_ups`)
  days: 7
  interval: 300             # refresh every 5 min, and right after new matches

# ---------------------------------------------------------------- web UI
# Jobs, boards, the cost-of-living map, stories and settings, behind a password (set on first visit
# with the setup code from the log). Served by `jobalerts run` on this port.
web:
  enabled: true
  port: 8765                # docker-compose.yml publishes the same port
  public_url: ""            # how your phone reaches this machine, e.g. http://192.168.1.20:8765; alerts link here
  frame_origins: []         # sites allowed to embed the shared map, e.g. [http://homeassistant.local:8123]; empty = any
  secure_cookies: false     # true if you serve it over HTTPS (reverse proxy)

# ---------------------------------------------------------------- cost-of-living map
# Every US metro's pay index (renting or buying, at any salary), the salary that breaks even with
# staying home, and your top jobs: the Map page, and a read-only link for a Home Assistant Webpage
# card (Settings > Account). Refreshes with the dashboard above. `jobalerts map --out FILE` writes it.
map:
  enabled: true

# ---------------------------------------------------------------- broad-net aggregators
# Slower, catch-all searches for companies not on the watch list. Their matches also
# feed "hiring for your search, not on your watch list" suggestions in the digest.
aggregators:
  usajobs:                  # free key: https://developer.usajobs.gov/apirequest/
    enabled: true           # skipped until USAJOBS_API_KEY and USAJOBS_EMAIL are set in .env
    interval: 1800
    searches:
      - {keyword: "physicist"}
      - {keyword: "plasma"}
      - {keyword: "accelerator"}
  adzuna:                   # free key: https://developer.adzuna.com/signup
    enabled: true           # skipped until ADZUNA_APP_ID and ADZUNA_APP_KEY are set in .env
    # New keys get 25 test calls only. "API Access" (GBP 8/month) allows 500 calls/day and 5,000/month.
    # 15 searches every 4 h = 90/day, ~2,700/month; every 2 h would be ~5,400/month (over). Searches look 2 days back.
    # what: all the words; what_or: any of them (give the search a name).
    interval: 14400
    country: us             # default; a search can set its own: gb de fr nl ch at it es pl in sg br mx ca au
    searches:
      - {what: "physicist"}
      - {what: "accelerator physicist"}
      - {what: "ion beam"}
      - {what: "plasma physicist"}
      - {what: "physicist", country: gb}
      - {what: "accelerator", country: gb}
      - {what: "physiker", country: de}
      - {what: "physicist", country: de}
      - {what: "physicist", country: nl}
      - {what: "physicist", country: ch}
      - {what: "physicist", country: sg}
      - {what: "físico", country: br}
      # France: beam and ion-source makers (Pantechnik, Sigmaphi, PMB-Alcen...) post on France Travail
      # and job boards rather than an ATS. Not "faisceau" alone: that's wiring harnesses.
      - {what: "physicist", country: fr}
      - {name: "beam-physics-fr", what_or: "physicien accélérateur ECR ionique ultravide", country: fr}
      # Netherlands: electron microscopy and electron optics (Delmic, DENSsolutions, Nearfield...)
      - {name: "electron-physics-nl", what_or: "electron elektronen microscopy microscopie", country: nl}
  jsearch:                  # paid slot (RapidAPI). Free plan ~200 calls/month: keep interval >= 14400
    enabled: true           # skipped until RAPIDAPI_KEY is set in .env
    interval: 14400
    searches:
      - {query: "physicist R&D manager"}
  theirstack:               # free key: https://app.theirstack.com (Settings > API Keys)
    enabled: true           # skipped until THEIRSTACK_API_KEY is set in .env
    # Each job returned costs 1 credit; the free plan has 200 a month, 25 jobs per call, 10 calls/min.
    # A poll only asks for jobs TheirStack found since the last poll, newest first, at most `limit`.
    # 1 search x 6 jobs x once a day = at most ~180 credits a month. Recruiting agencies are left out.
    interval: 86400
    searches:
      - name: physics
        titles: [physicist, plasma, ion beam, electron beam, charged particle, pulsed power, accelerator physicist]
        exclude_titles: [intern, internship]
        countries: [US]     # ISO codes; add more (GB, DE, NL, CH...) only if you raise the credit budget
        max_age_days: 7     # posted in the last week (the API needs a posted-date filter)
        limit: 6
