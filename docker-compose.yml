services:
  jobalerts:
    build: .
    image: jobalerts:latest
    container_name: jobalerts
    restart: unless-stopped
    env_file: .env
    user: "1000:1000"          # must be able to write ./data (and ./config for `discover --add`)
    volumes:
      - ./config:/app/config   # config.yaml, companies.yaml, profile.md, taxes.yaml, tax_data.json
      - ./data:/app/data       # SQLite database
      - ./resume_reference:/app/resume_reference:ro   # PDF/.md resumes (which version to apply with)
      - ./stories:/app/stories:ro                     # work stories the AI scorer judges fit against
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
