services:
  jobalerts:
    build: .
    image: jobalerts:latest
    container_name: jobalerts
    restart: unless-stopped
    env_file:
      - path: .env               # optional: keys can be saved on the Settings page instead
        required: false
    ports:
      - "8765:8765"            # web UI (jobs, boards, map, stories, settings) and the Home Assistant map card
    user: "1000:1000"          # must be able to write ./data
    volumes:
      - ./config:/app/config:ro   # shipped defaults: config.yaml, taxes.yaml, price and tax tables
      - ./data:/app/data          # yours: database, config.local.yaml, profile, stories, resumes, watch list
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
